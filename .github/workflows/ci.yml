name: Cross-Platform CI Matrix & Executable Builder

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  PYTHONIOENCODING: utf-8

jobs:
  cleanup-old-artifacts:
    name: Delete Artifacts from Previous Commits
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Delete Artifacts from Previous Workflow Runs
        uses: actions/github-script@v7
        with:
          script: |
            try {
              const runs = await github.rest.actions.listWorkflowRunsForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                branch: context.ref.replace('refs/heads/', ''),
                status: 'completed'
              });
              for (const run of runs.data.workflow_runs) {
                const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: run.id
                });
                for (const artifact of artifacts.data.artifacts) {
                  console.log(`Deleting old artifact: ${artifact.name} (id: ${artifact.id}) from run #${run.run_number}`);
                  await github.rest.actions.deleteArtifact({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    artifact_id: artifact.id
                  });
                }
              }
            } catch (error) {
              console.log('Artifact cleanup notice:', error.message);
            }

  test-matrix:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    needs: cleanup-old-artifacts
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Virtual Display (Ubuntu Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run Flake8 Linter
        run: |
          flake8 src tests --max-line-length=100

      - name: Run Pytest with Coverage
        run: |
          pytest --cov=src/system_inspector --cov-report=term-missing tests/

      - name: Run System Inspector CLI (Summary)
        run: |
          python -m system_inspector.cli --summary

      - name: Run Folder Inspector CLI (Local Scan)
        run: |
          python -m system_inspector.cli --folder .

      - name: Capture GUI Window Screenshot (Linux)
        if: runner.os == 'Linux'
        run: |
          xvfb-run python -m system_inspector.screenshot_generator

      - name: Capture GUI Window Screenshot (Windows / macOS)
        if: runner.os != 'Linux'
        run: |
          python -m system_inspector.screenshot_generator

      - name: Upload GUI Screenshot Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gui-screenshot-${{ matrix.os }}-py${{ matrix.python-version }}
          path: screenshots/
          retention-days: 1
          if-no-files-found: ignore

  build-executables:
    name: Build Binary Executable (${{ matrix.os }})
    needs: test-matrix
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Build Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Build Executable with PyInstaller (Windows .exe)
        if: runner.os == 'Windows'
        run: |
          pyinstaller --noconfirm --onefile --windowed --name SystemInspector src/system_inspector/cli.py

      - name: Build Executable with PyInstaller (macOS .app / binary)
        if: runner.os == 'macOS'
        run: |
          pyinstaller --noconfirm --onefile --windowed --name SystemInspector src/system_inspector/cli.py

      - name: Build Executable with PyInstaller (Linux binary)
        if: runner.os == 'Linux'
        run: |
          pyinstaller --noconfirm --onefile --windowed --name SystemInspector src/system_inspector/cli.py

      - name: Upload Executable Artifact (Windows .exe)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: SystemInspector-Windows-Executable
          path: dist/SystemInspector.exe
          retention-days: 1

      - name: Upload Executable Artifact (macOS .app / binary)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: SystemInspector-macOS-Executable
          path: dist/SystemInspector*
          retention-days: 1

      - name: Upload Executable Artifact (Linux Binary)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: SystemInspector-Linux-Executable
          path: dist/SystemInspector
          retention-days: 1
