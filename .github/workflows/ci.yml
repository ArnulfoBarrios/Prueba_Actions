name: Cross-Platform CI Matrix

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-matrix:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run Flake8 Linter
        run: |
          flake8 src tests --max-line-length=100

      - name: Run Pytest with Coverage
        run: |
          pytest --cov=src/system_inspector --cov-report=term-missing tests/

      - name: Run System Inspector CLI (Text Output)
        run: |
          python -m system_inspector.cli --summary

      - name: Run System Inspector CLI (JSON Output)
        run: |
          python -m system_inspector.cli --json
