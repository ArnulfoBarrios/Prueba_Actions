[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "system-inspector"
version = "0.1.0"
description = "Multi-platform System Inspector MVP for testing GitHub Actions workflows"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "flake8>=6.0.0",
    "pillow>=9.0.0",
    "pyinstaller>=6.0.0"
]

[project.scripts]
system-inspector = "system_inspector.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
